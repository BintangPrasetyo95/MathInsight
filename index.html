let trkMesh,brMesh,flwSglMesh,trkCnt=0,brCnt=0,bmCnt=0,sglCnt=0,aoCnt=0;
const animBranches=[],animClusters=[],animSingles=[],lanternLights=[];
const rcs=new THREE.Raycaster(),ndc=new THREE.Vector2(),GY=-40,o3=new THREE.Object3D(),o4=new THREE.Object3D(),vA=new THREE.Vector3(),vB=new THREE.Vector3(),vU=new THREE.Vector3(0,1,0),qA=new THREE.Quaternion(),qB=new THREE.Quaternion(),eA=new THREE.Euler();
const cc={a:new THREE.Color('#f1f5f9'),b:new THREE.Color('#020203'),c:new THREE.Color('#f0ddd0'),w:new THREE.Color(1,1,1),p:new THREE.Color('#ffefe2'),s:new THREE.Color('#ffdca2')},PP=(a,b)=>es(cl(T,a,b));
const sakuraPal=[0xfff5f7,0xfce2ec,0xf6bfd3,0xefa4c0,0xe288ab,0xfbe7ee].map(c=>new THREE.Color(c));

/* Winding pathway & organic garden elevation functions (keeps letter landing zone at (0,0,0.6) level) */
const pathO=Math.sin(.6*.22)*.95+Math.cos(.6*.11)*.22;
const pathX=z=>Math.sin(z*.22)*.95+Math.cos(z*.11)*.22-pathO;
function gy(x,z){
  const px=pathX(z),dx=Math.abs(x-px),b=es(cl(dx,.68,4.2));
  const und=Math.sin(x*.26+z*.19)*.34+Math.cos(x*.41-z*.27)*.22+Math.sin(x*.85+z*.7)*.06;
  const hill=es(cl(-z,12,48))*(1.1+Math.sin(x*.14)*0.65+es(cl(dx,1.5,14))*1.8);
  return b*(.24+Math.max(-.08,und))+hill;
}

/* Soft radial canvas texture for contact shadows & warm lantern glow pools */
function createRadialTex(r,g,b,aCenter,aMid){
  const c=document.createElement('canvas');c.width=c.height=64;
  const ctx=c.getContext('2d'),grd=ctx.createRadialGradient(32,32,2,32,32,32);
  grd.addColorStop(0,`rgba(${r},${g},${b},${aCenter})`);
  grd.addColorStop(.45,`rgba(${r},${g},${b},${aMid})`);
  grd.addColorStop(1,`rgba(${r},${g},${b},0)`);
  ctx.fillStyle=grd;ctx.fillRect(0,0,64,64);
  const tx=new THREE.CanvasTexture(c);tx.encoding=THREE.sRGBEncoding;
  return tx;
}

/* Register ground contact AO disc under trees, lanterns, and boulders */
function addContactAO(x,z,rx,rz){
  if(!aoMesh||aoCnt>=aoMesh.count)return;
  o3.position.set(x,gy(x,z)+.012,z);
  o3.rotation.set(-Math.PI/2,0,0);
  o3.scale.set(rx,rz,1);
  o3.updateMatrix();
  aoMesh.setMatrixAt(aoCnt++,o3.matrix);
}

/* Subsurface Scattering (SSS) shader hook for double-sided cherry blossom petals */
function applyPetalSSS(mat){
  mat.onBeforeCompile=sh=>{
    sh.fragmentShader=sh.fragmentShader.replace(
      'reflectedLight.directDiffuse += ( gl_FrontFacing ) ? vLightFront : vLightBack;',
      'vec3 fL=(gl_FrontFacing)?vLightFront:vLightBack;vec3 bL=(gl_FrontFacing)?vLightBack:vLightFront;reflectedLight.directDiffuse+=fL*0.86+bL*vec3(1.0,0.68,0.78)*0.58;'
    );
  };
}

/* Helper to merge BufferGeometries with vertex colors */
function mergeGeos(list){
  let vp=0,vi=0;
  list.forEach(g=>{vp+=g.attributes.position.count*3;vi+=g.index?g.index.count:g.attributes.position.count});
  const P=new Float32Array(vp),N=new Float32Array(vp),C_=new Float32Array(vp),I=new Uint32Array(vi);
  let po=0,io=0,vo=0;
  list.forEach(g=>{
    const p=g.attributes.position.array,n=g.attributes.normal.array,c=g.attributes.color?g.attributes.color.array:null,cnt=g.attributes.position.count;
    P.set(p,po);N.set(n,po);
    if(c)C_.set(c,po);else for(let i=0;i<cnt*3;i++)C_[po+i]=1;
    if(g.index){const ix=g.index.array;for(let i=0;i<ix.length;i++)I[io+i]=ix[i]+vo;io+=ix.length}
    else{for(let i=0;i<cnt;i++)I[io+i]=vo+i;io+=cnt}
    po+=cnt*3;vo+=cnt;
  });
  const m=new THREE.BufferGeometry();
  m.setAttribute('position',new THREE.BufferAttribute(P,3));
  m.setAttribute('normal',new THREE.BufferAttribute(N,3));
  m.setAttribute('color',new THREE.BufferAttribute(C_,3));
  m.setIndex(new THREE.BufferAttribute(I,1));
  return m;
}

/* Tapered organic bark limb geometry with joint dome and bark vertex color variation */
function createLimbGeometry(radSeg,htSeg,taper,curveAmt){
  const g=new THREE.CylinderGeometry(taper,1,1,radSeg,htSeg,false);
  g.translate(0,.5,0);
  const p=g.attributes.position,cnt=p.count,col=new Float32Array(cnt*3),c1=new THREE.Color(0x3a2a22),c2=new THREE.Color(0x574338),c3=new THREE.Color(0x635147),tmp=new THREE.Color();
  for(let i=0;i<cnt;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const ang=Math.atan2(z,x),flare=y<.22?Math.pow(1-y/.22,2)*.22*(1+.35*Math.sin(ang*5)):0;
    const ridge=1+.06*Math.sin(ang*4+y*7)+.04*Math.cos(ang*7-y*5);
    const bend=Math.sin(y*Math.PI)*curveAmt;
    x=x*(1+flare)*ridge+bend;
    z=z*(1+flare)*ridge+bend*.4;
    if(y>.98){const cap=(y-.98)/.02;y=1+.04*cap;x*=.92;z*=.92}
    p.setXYZ(i,x,y,z);
    tmp.copy(c1).lerp(c2,cl(y,0,.7)).lerp(c3,.25+.25*Math.sin(ang*3+y*9));
    col[i*3]=tmp.r;col[i*3+1]=tmp.g;col[i*3+2]=tmp.b;
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.computeVertexNormals();
  return g;
}

/* Five-petal notched sakura geometry */
function createCherryBlossomGeometry(){
  const pos=[],col=[],idx=[];
  const cCore=new THREE.Color(0xc8527b),cMid=new THREE.Color(0xf6c2d4),cTip=new THREE.Color(0xfff4f8),cStam=new THREE.Color(0xf0b57a);
  const addV=(x,y,z,c)=>{pos.push(x,y,z);col.push(c.r,c.g,c.b);return(pos.length/3)-1};
  for(let p=0;p<5;p++){
    const a=p*1.256637+.06,ca=Math.cos(a),sa=Math.sin(a);
    const rot=(u,v,w)=>{
      const vt=v+u*.07;
      return [u*ca-vt*sa,w,u*sa+vt*ca];
    };
    const v0=addV(...rot(.05,0,.01),cCore);
    const v1=addV(...rot(.22,-.15,.06),cMid);
    const v2=addV(...rot(.24,0,.04),cMid);
    const v3=addV(...rot(.22,.15,.06),cMid);
    const v4=addV(...rot(.39,-.17,.10),cTip);
    const v5=addV(...rot(.46,-.08,.09),cTip);
    const v6=addV(...rot(.37,0,.075),cMid);
    const v7=addV(...rot(.46,.08,.09),cTip);
    const v8=addV(...rot(.39,.17,.10),cTip);
    idx.push(v0,v1,v2, v0,v2,v3, v1,v4,v2, v2,v4,v5, v2,v5,v6, v2,v6,v7, v2,v7,v8, v2,v8,v3);
  }
  const vc=addV(0,-.02,0,cCore);
  for(let s=0;s<5;s++){
    const a=s*1.256637+.62,a2=a+.55;
    const s1=addV(Math.cos(a)*.05,.02,Math.sin(a)*.05,cCore);
    const s2=addV(Math.cos(a2)*.05,.02,Math.sin(a2)*.05,cCore);
    const st=addV(Math.cos(a+.25)*.11,.09,Math.sin(a+.25)*.11,cStam);
    idx.push(vc,s1,st, vc,st,s2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* Realistic multi-flower blossom cluster */
function createBlossomCluster(flwGeo){
  const list=[],nF=[7,8,9][Q],m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),p=new THREE.Vector3(),s=new THREE.Vector3();
  const layouts=[
    [0,.12,0, 0,0,0, .62],
    [.15,.08,.06, .35,.4,-.45, .56],
    [-.15,.07,.07, .38,-.5,.42, .54],
    [.06,.06,-.16, -.48,.2,.22, .58],
    [-.09,.09,-.13, -.42,-.3,.35, .52],
    [.17,.01,-.07, -.15,.8,-.65, .50],
    [-.16,.02,-.05, -.12,-.7,.62, .53],
    [.02,.11,.16, .58,.15,-.1, .55],
    [-.04,-.03,.14, .75,-.25,.2, .48]
  ];
  for(let i=0;i<nF;i++){
    const L=layouts[i],g=flwGeo.clone();
    p.set(L[0],L[1],L[2]);
    e.set(L[3],L[4]+i*1.1,L[5]);
    q.setFromEuler(e);
    s.setScalar(L[6]);
    m.compose(p,q,s);
    g.applyMatrix4(m);
    const ca=g.attributes.color.array,sh=.90+(i%3)*.05;
    for(let k=0;k<ca.length;k+=3){ca[k]=Math.min(1,ca[k]*sh);ca[k+1]=Math.min(1,ca[k+1]*(sh-.02));ca[k+2]=Math.min(1,ca[k+2]*sh)}
    list.push(g);
  }
  return mergeGeos(list);
}

/* Record limb segment into instanced trunk or branch buffers */
function addLimbSeg(A,B,r,isSecondary,piv,ph){
  vA.subVectors(B,A);const len=vA.length();if(len<.02)return;
  qA.setFromUnitVectors(vU,vA.clone().normalize());
  if(!isSecondary){
    if(trkCnt>=trkMesh.count)return;
    o3.position.copy(A);o3.quaternion.copy(qA);o3.scale.set(r,len,r);o3.updateMatrix();
    trkMesh.setMatrixAt(trkCnt++,o3.matrix);
  }else{
    if(brCnt>=brMesh.count)return;
    const idx=brCnt++;
    o3.position.copy(A);o3.quaternion.copy(qA);o3.scale.set(r,len,r);o3.updateMatrix();
    brMesh.setMatrixAt(idx,o3.matrix);
    if(piv)animBranches.push({idx,ax:A.x,ay:A.y,az:A.z,px:piv.x,py:piv.y,pz:piv.z,qx:qA.x,qy:qA.y,qz:qA.z,qw:qA.w,sx:r,sy:len,sz:r,ph});
  }
}

/* Place blossom cluster with full-length arched vista tunnel check along pathX(z) */
function placeCluster(x,y,z,sc,rx,ry,rz,piv,ph,singleOnly){
  const dx=Math.abs(x-pathX(z));
  if(z>-22&&z<4.5&&y<4.35&&dx<lp(1.45,2.1,cl(-z,0,18)))return;
  const col=sakuraPal[(rnd()*sakuraPal.length)|0];
  if(!singleOnly&&bmCnt<bm.count){
    const idx=bmCnt++;
    o4.position.set(x,y,z);o4.rotation.set(rx,ry,rz);o4.scale.setScalar(sc);o4.updateMatrix();
    bm.setMatrixAt(idx,o4.matrix);bm.setColorAt(idx,col);
    if(piv)animClusters.push({idx,x,y,z,px:piv.x,py:piv.y,pz:piv.z,rx,ry,rz,sc,ph});
  }
  if(flwSglMesh&&sglCnt<flwSglMesh.count&&(singleOnly||rnd()<.55)){
    const idx=sglCnt++,ox=x+(rnd()-.5)*.28,oy=y+(rnd()-.5)*.22,oz=z+(rnd()-.5)*.28,ssc=sc*(.55+rnd()*.35);
    o4.position.set(ox,oy,oz);o4.rotation.set(rx+(rnd()-.5),ry+rnd()*3,rz+(rnd()-.5));o4.scale.setScalar(ssc);o4.updateMatrix();
    flwSglMesh.setMatrixAt(idx,o4.matrix);flwSglMesh.setColorAt(idx,sakuraPal[(rnd()*sakuraPal.length)|0]);
    if(piv)animSingles.push({idx,x:ox,y:oy,z:oz,px:piv.x,py:piv.y,pz:piv.z,rx,ry,rz,sc:ssc,ph});
  }
}

/* Main trunk structure */
function createTrunk(x,y,z,cfg){
  addContactAO(x,z,cfg.radius*6.2,cfg.radius*6.2);
  const segs=cfg.trunkSegs||4,pts=[new THREE.Vector3(x,y-.08,z)];
  let cx=x,cy=y,cz=z,r=cfg.radius;
  const nRoots=3+(rnd()*2|0);
  for(let k=0;k<nRoots;k++){
    const ra=k*(6.283/nRoots)+rnd()*.5,rl=.35+r*1.3;
    addLimbSeg(new THREE.Vector3(x+Math.cos(ra)*rl,y-.12,z+Math.sin(ra)*rl),new THREE.Vector3(x+Math.cos(ra)*r*.35,y+.45+rnd()*.25,z+Math.sin(ra)*r*.35),r*.52,false);
  }
  for(let i=0;i<segs;i++){
    const sl=cfg.trunkH/segs;
    cx+=cfg.leanX*sl+(rnd()-.5)*.22;
    cz+=cfg.leanZ*sl+(rnd()-.5)*.22;
    cy+=sl;
    const np=new THREE.Vector3(cx,cy,cz);
    addLimbSeg(pts[pts.length-1],np,r*Math.pow(.76,i),false);
    pts.push(np);
  }
  return {top:pts[pts.length-1],mid:pts[Math.max(1,segs-2)],rTop:r*Math.pow(.76,segs-1)};
}

/* Primary branches arching high or outward along the scenic pathway corridor */
function createPrimaryBranches(trunkData,cfg){
  const pList=[],nP=cfg.nPrimary;
  for(let i=0;i<nP;i++){
    const base=(i===0&&nP>3)?trunkData.mid.clone():trunkData.top.clone();
    const az=cfg.baseAz+i*(6.283/nP)+(rnd()-.5)*.55;
    let dirX=Math.cos(az)*cfg.spread,dirZ=Math.sin(az)*cfg.spread,dirY=cfg.rise+(rnd()-.5)*.22;
    const px=pathX(base.z);
    if(Math.abs(base.x-px)<2.8){
      const away=(base.x-px)>=0?1:-1;
      dirY+=.18;
      if(Math.sign(dirX)!==away&&Math.abs((base.x-px)+dirX*1.8)<1.55)dirX=away*Math.abs(dirX)*.75;
    }
    const segs=3,len=cfg.pLen*(.82+rnd()*.36)/segs;
    let cur=base.clone(),r=trunkData.rTop*(.68+rnd()*.14);
    const joints=[];
    for(let s=0;s<segs;s++){
      const arch=cfg.arching?-.16*s:(.05*s);
      const nxt=new THREE.Vector3(cur.x+dirX*len+(rnd()-.5)*.16,cur.y+(dirY+arch)*len,cur.z+dirZ*len+(rnd()-.5)*.16);
      addLimbSeg(cur,nxt,r,false);
      cur=nxt;r*=.74;
      if(s>=1)joints.push({pos:cur.clone(),r,dir:new THREE.Vector3(dirX,dirY+arch,dirZ).normalize(),az});
    }
    pList.push(...joints);
  }
  return pList;
}

/* Secondary branches */
function createSecondaryBranches(primaries,cfg){
  const sList=[];
  primaries.forEach((p,pi)=>{
    const nS=cfg.nSecondary+(rnd()<.45?1:0);
    for(let i=0;i<nS;i++){
      const piv=p.pos.clone(),ph=cfg.phase+pi*.7+i*.45;
      const side=(i%2?1:-1)*(.45+rnd()*.55),az=p.az+side;
      const up=cfg.arching?(-.08+rnd()*.22):(.22+rnd()*.32);
      const segs=2,len=cfg.sLen*(.78+rnd()*.38)/segs;
      let cur=piv.clone(),r=p.r*.68;
      for(let s=0;s<segs;s++){
        const drop=cfg.arching?-.18*s:0;
        const nxt=new THREE.Vector3(cur.x+Math.cos(az)*len,cur.y+(up+drop)*len,cur.z+Math.sin(az)*len);
        addLimbSeg(cur,nxt,r,true,piv,ph);
        cur=nxt;r*=.72;
        sList.push({pos:cur.clone(),piv,r,az,up:up+drop,ph,isTip:s===segs-1});
      }
    }
  });
  return sList;
}

/* Terminal twigs */
function createTerminalTwigs(secondaries,cfg){
  const twigs=[];
  secondaries.forEach(sb=>{
    const nT=sb.isTip?2+(rnd()<.5?1:0):1;
    for(let i=0;i<nT;i++){
      const az=sb.az+(i-.5)*(.85+rnd()*.4),len=cfg.tLen*(.75+rnd()*.45);
      const dy=cfg.arching?(-.22+rnd()*.18):(.15+rnd()*.28);
      const tip=new THREE.Vector3(sb.pos.x+Math.cos(az)*len,sb.pos.y+dy*len,sb.pos.z+Math.sin(az)*len);
      addLimbSeg(sb.pos,tip,Math.max(.016,sb.r*.58),true,sb.piv,sb.ph);
      twigs.push({base:sb.pos.clone(),tip,piv:sb.piv,ph:sb.ph,az,isOuter:sb.isTip});
    }
  });
  return twigs;
}

/* Irregular layered sakura canopy */
function createSakuraCanopy(secondaries,twigs,cfg){
  twigs.forEach(tw=>{
    const sc=cfg.cScale*(.78+rnd()*.44);
    placeCluster(tw.tip.x,tw.tip.y,tw.tip.z,sc,(rnd()-.5)*.7,tw.az+rnd()*3,(rnd()-.5)*.7,tw.piv,tw.ph,false);
    if(rnd()<cfg.density){
      const mx=lp(tw.base.x,tw.tip.x,.55)+(rnd()-.5)*.28;
      const my=lp(tw.base.y,tw.tip.y,.55)+(.08+rnd()*.22)*(cfg.arching?-1:1);
      const mz=lp(tw.base.z,tw.tip.z,.55)+(rnd()-.5)*.28;
      placeCluster(mx,my,mz,sc*(.72+rnd()*.28),(rnd()-.5)*.8,rnd()*6.28,(rnd()-.5)*.8,tw.piv,tw.ph+.3,false);
    }
  });
  secondaries.forEach(sb=>{
    if(rnd()<cfg.density*.65){
      const sc=cfg.cScale*(.65+rnd()*.3);
      placeCluster(sb.pos.x+(rnd()-.5)*.24,sb.pos.y+.12+rnd()*.18,sb.pos.z+(rnd()-.5)*.24,sc,(rnd()-.5)*.5,rnd()*6.28,(rnd()-.5)*.5,sb.piv,sb.ph,false);
    }
  });
}

/* Multiple distinct sakura tree types (A, B, C, D) */
function createSakuraTree(x,z,type,scale=1){
  const y=gy(x,z),sSign=x>=0?1:-1,ph=rnd()*6.28;
  const presets={
    A:{radius:.27*scale,trunkH:2.2*scale,trunkSegs:4,leanX:-sSign*.14,leanZ:(rnd()-.5)*.12,nPrimary:4,pLen:2.5*scale,spread:.88,rise:.42,nSecondary:2,sLen:1.45*scale,tLen:.68*scale,cScale:.72*scale,density:.78,arching:false},
    B:{radius:.23*scale,trunkH:2.45*scale,trunkSegs:5,leanX:-sSign*.24,leanZ:.08,nPrimary:4,pLen:2.35*scale,spread:.92,rise:.34,nSecondary:3,sLen:1.55*scale,tLen:.82*scale,cScale:.66*scale,density:.85,arching:true},
    C:{radius:.25*scale,trunkH:3.15*scale,trunkSegs:5,leanX:-sSign*.1,leanZ:(rnd()-.5)*.1,nPrimary:4,pLen:2.4*scale,spread:.72,rise:.64,nSecondary:2,sLen:1.4*scale,tLen:.65*scale,cScale:.74*scale,density:.74,arching:false},
    D:{radius:.19*scale,trunkH:1.55*scale,trunkSegs:3,leanX:-sSign*.16,leanZ:(rnd()-.5)*.14,nPrimary:3,pLen:1.85*scale,spread:.86,rise:.38,nSecondary:2,sLen:1.15*scale,tLen:.55*scale,cScale:.64*scale,density:.82,arching:false}
  };
  const cfg=Object.assign({baseAz:rnd()*6.28,phase:ph},presets[type]||presets.A);
  const trk=createTrunk(x,y,z,cfg);
  const prim=createPrimaryBranches(trk,cfg);
  const sec=createSecondaryBranches(prim,cfg);
  const tw=createTerminalTwigs(sec,cfg);
  createSakuraCanopy(sec,tw,cfg);
}

/* Foreground framing branches */
function createForegroundFramingBranch(side,yBase,zBase,reach,archDrop){
  const piv=new THREE.Vector3(side*3.4,yBase,zBase),ph=rnd()*6.28;
  let cur=piv.clone(),r=.13;
  const dirX=-side,segs=3,len=reach/segs,sec=[];
  for(let s=0;s<segs;s++){
    const nxt=new THREE.Vector3(cur.x+dirX*len,cur.y+(.12-s*archDrop)*len,cur.z+(rnd()-.5)*.28);
    addLimbSeg(cur,nxt,r,true,piv,ph);
    cur=nxt;r*=.74;
    sec.push({pos:cur.clone(),piv,r,az:dirX>0?0:Math.PI,up:.05-s*archDrop,ph,isTip:s===segs-1});
  }
  const tw=createTerminalTwigs(sec,{tLen:.55,arching:archDrop>.1,phase:ph});
  tw.forEach(t=>{
    placeCluster(t.tip.x,t.tip.y,t.tip.z,.58+rnd()*.22,(rnd()-.5)*.6,rnd()*6.28,(rnd()-.5)*.6,piv,ph,false);
    placeCluster(t.base.x,t.base.y,t.base.z,.48+rnd()*.18,(rnd()-.5)*.6,rnd()*6.28,(rnd()-.5)*.6,piv,ph,true);
  });
}

/* Organic 3D undulating terrain */
function createGardenTerrain(){
  const seg=[56,68,80][Q],g=new THREE.PlaneGeometry(110,110,seg,seg);
  g.rotateX(-Math.PI/2);
  const p=g.attributes.position,cnt=p.count,col=new Float32Array(cnt*3);
  const cSoil=new THREE.Color(0x786855),cMoss=new THREE.Color(0x557538),cGrass=new THREE.Color(0x456834),cDeep=new THREE.Color(0x365229),cPetal=new THREE.Color(0xd8b2bc),tmp=new THREE.Color();
  for(let i=0;i<cnt;i++){
    const x=p.getX(i),z=p.getZ(i),y=gy(x,z);
    p.setY(i,y);
    const dx=Math.abs(x-pathX(z));
    const n1=.5+.5*Math.sin(x*.45+z*.38),n2=.5+.5*Math.cos(x*.8-z*.65);
    tmp.copy(cGrass).lerp(cMoss,n1*.65).lerp(cDeep,n2*.4);

/* Subdivided 12x18 curved paper geometry */
function createCurvedPaperGeo(w,h,ox,oy,u0,u1,v0,v1,mode){
  const g=new THREE.PlaneGeometry(w,h,12,18);
  const pos=g.attributes.position,uv=g.attributes.uv,cnt=pos.count;
  for(let i=0;i<cnt;i++){
    let x=pos.getX(i),y=pos.getY(i);
    const nx=x/(w/2),ny=y/(h/2);
    const u=(nx*.5+.5),v=(ny*.5+.5);
    uv.setXY(i,lp(u0,u1,u),lp(v0,v1,v));

    let z=0;
    if(mode==='center'){
      const hx=1-nx*nx,hy=1-Math.max(0,ny)*Math.max(0,ny);
      z=hx*hy*.014+Math.sin(nx*3.14)*Math.cos(ny*3.14)*.0035;
      if(ny<-.92)y+=Math.sin(x*38)*.0018;
    }else if(mode==='left'||mode==='right'){
      const dist=Math.abs(x+ox)/w;
      z=Math.pow(dist,1.45)*.013+Math.sin(ny*3.14)*dist*.0045;
      if(dist>.94){x+=(mode==='left'?-1:1)*Math.sin(y*34)*.0018;z+=Math.cos(y*28)*.0022}
    }else if(mode==='up'){
      const dist=Math.abs(y+oy)/h;
      z=Math.pow(dist,1.45)*.013+Math.cos(nx*3.14)*dist*.004;
      if(dist>.94){y+=Math.sin(x*34)*.0018;z+=Math.cos(x*26)*.0022}
    }
    pos.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals();
  return g;
}
